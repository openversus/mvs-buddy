# The game's quit function, for dialogs that offer to quit.
QuitGameCallback = "40 ? 48 83 ? ? 48 8B ? 48 83 ? ? E8 ? ? ? ? 84 C0 74 19 48 8B ? ? 45 33 C9 45 33 C0"

# Where the game creates its game instance.
FighterInstance = "48 8D 05 ? ? ? 00 49 89 ? ? 48 8D ? ? ? ? ? 49 89 ? ? 49 C7 ? ? 00 00 00 00 C7 44 ? ? 08 00 00 10 C7 44 ? ? 08 00 00 00 C7 44 ? ? 70 08 00 00"

# The game's function that shows a toast notification.
Notifications = "FF 50 ? F3 0F 10 ? ? ? ? ? 48 8B ? F3 0F ? ? ? E8"

# The post-match freeze (PostMatchFreeze).
PostMatchFreeze = "45 3B F8 75 11 0F B6 83 F1 05 00 00 2C 07 3C 02 0F 86 ? ? ? ?"

# ---------------------------------------------------------------------------
# For troubleshooting and development. The defaults are what you want.
# ---------------------------------------------------------------------------
[Settings.Debug]

# Opens a console window beside the game, showing the log as it is written.
ShowConsole = true

# Holds startup at a message box until you click OK (handy for attaching a debugger).
DebugPause = false

# With LogLevel = 0, logs at debug level. Otherwise it does nothing.
DebugLogging = false

# Silences the warning shown when the mod is loaded by something that isn't MultiVersus.
NonMVSPatching = false

# For profiling; leave it off. Counts calls to the end-of-service check and logs them once a minute.
CountSunsetCalls = false

# For testing updates from a fork; leave it. Game content only downloads from this GitHub account's releases.
ReleaseOwner = "openversus"

# For testing match rules; leave it off. Writes logs/MatchRules.log: each match's settings, stock-rule deaths and every friendly-fire hit.
MatchRulesLog = false

# For testing; leave it off. Friendly fire in offline matches (Local Play, the Lab) without the mutator. Online matches only ever get it from the server.
FriendlyFireOffline = false

# For testing; leave it at 100. Game speed in percent for offline matches (Local Play, the Lab): 120 runs them 20% faster. Online matches are never changed.
LabGameSpeedPercent = 100

# ---------------------------------------------------------------------------
# The OpenVersus server. Leave this section alone unless you run your own server.
# ---------------------------------------------------------------------------
[Server.Game]

# TL;DR: The OpenVersus server.
#
# The game's own server connection goes here, and so do the mod's update check, server
# announcements and registration.
ServerUrl = "https://prod.openversus.org/"

# Points the game's server connection at ServerUrl above, and checks for announcements.
# Off means the game tries its original servers, which no longer exist.
Enabled = true

# TL;DR: Where the rollback node finds the other player for a match run between players. Leave it.
#
# A host name (or an IP address). The OpenVersus server points this name wherever the
# service runs. Empty turns direct matches off: every such match goes through an OpenVersus
# relay instead.
P2PRegistry = "p2p.openversus.org"

# The UDP port of that service.
P2PRegistryPort = 41235

# ---------------------------------------------------------------------------
# The server the game's WB network connection goes to. Same advice as above.
# ---------------------------------------------------------------------------
[Server.Prod]

# Where the game's WB network connection goes.
ServerUrl = "https://prod.openversus.org/"

# Points the game's WB network connection at ServerUrl above.
Enabled = true
